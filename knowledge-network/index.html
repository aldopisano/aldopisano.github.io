/* argomenti: id, nome, discipline, descrizione, risorse */
const TOP=[
 ["ww1","Prima guerra mondiale",["storia","geo","eco"],"1914-1918: la prima guerra totale, con eserciti di massa, industria e civili mobilitati.",[["Kit di ripasso","grande-guerra/"]]],
 ["cap","Caporetto 1917",["storia"],"Lo sfondamento austro-tedesco del 24 ottobre 1917 e la ritirata italiana fino al Piave.",[["Simulazione interattiva","caporetto/"]]],
 ["ww2","Seconda guerra mondiale",["storia"],"1939-1945: il conflitto più distruttivo della storia, chiuso dalle bombe atomiche sul Giappone."],
 ["shoah","Shoah e leggi razziali",["storia","dir"],"Lo sterminio degli ebrei d'Europa. In Italia le leggi razziali sono del 1938."],
 ["rrus","Rivoluzione russa",["storia","eco"],"Nel 1917 cade lo zar e i bolscevichi prendono il potere: nasce il primo Stato comunista."],

 ["vacc","Vaccini",["med","bio"],"Da Jenner (1796) a Pasteur: la prevenzione che ha permesso di eradicare il vaiolo (1980)."],
 ["pasteur","Pasteur e la fermentazione",["bio","chim","cibo"],"Pasteur scopre che la fermentazione è opera di microrganismi: nasce la pastorizzazione."],
 ["freud","Freud e l'inconscio",["psi","med"],"L'interpretazione dei sogni (1899): la psicoanalisi esplora l'inconscio."],
 ["monte","Maria Montessori",["ped","med"],"Tra le prime donne laureate in medicina in Italia (1896), apre la Casa dei Bambini (1907)."],
 ["dante","Dante e la Commedia",["lett","ling"],"Il poema che fa del volgare fiorentino la base dell'italiano."],
 ["ital","La lingua italiana",["ling"],"Dal volgare di Dante alla lingua di tutti, passando per Manzoni e la scuola."],
 ["roman","Romanticismo",["lett","arte","musica"],"Tra fine Settecento e Ottocento: sentimento, nazione, natura, individuo."],
 ["beet","Beethoven",["musica"],"Ponte tra classicismo e romanticismo; la Terza sinfonia era dedicata a Napoleone."],
 ["leon","Leonardo da Vinci",["arte","tec","med"],"Pittore, ingegnere, anatomista: il sapere senza confini tra le discipline."],
 ["ungar","Ungaretti",["lett"],"Soldato sul Carso, scrive in trincea le poesie de «Il porto sepolto» (1916)."],
 ["svevo","Svevo e Zeno",["lett","psi"],"«La coscienza di Zeno» (1923) racconta un uomo in analisi: la psicoanalisi entra nel romanzo."],
 ["turing","Turing e il computer",["info","mat"],"La macchina di Turing (1936) definisce che cosa significa calcolare."],

 ["aiact","AI Act europeo",["dir","info"],"Il Regolamento (UE) 2024/1689 classifica i sistemi di IA in base al rischio."],
 ["disinf","Disinformazione",["ling","psi","info"],"Come nascono e circolano le notizie false, dalla propaganda ai deepfake."],
 ["dudu","Diritti umani (1948)",["dir","filo"],"La Dichiarazione universale dei diritti umani dell'ONU, dopo la Seconda guerra mondiale."],
 ["cost","Costituzione italiana",["dir","storia"],"In vigore dal 1948. L'art. 11: «L'Italia ripudia la guerra»."],
 ["smith","Adam Smith e il mercato",["eco","filo"],"La ricchezza delle nazioni (1776): divisione del lavoro e libero scambio."],
 ["clima","Cambiamento climatico",["geo","chim","fis"],"I gas serra prodotti dalle attività umane riscaldano il pianeta. Accordo di Parigi: 2015."],

 ["gas","Armi chimiche",["chim","storia"],"Cloro, fosgene, iprite: nella Grande Guerra la chimica industriale diventa arma."]
];
/* legami reali tra argomenti */
const LINKS=[
 ["ww1","cap","la battaglia del 1917 sul fronte italiano"],
 ["ww1","rrus","la guerra fa crollare l'impero zarista"],
 ["ww1","ww2","Versailles e la crisi del dopoguerra preparano il nuovo conflitto"],
 ["ww1","gas","primo uso di massa dei gas (Ypres, 1915)"],
 ["cap","gas","il gas lanciato a Plezzo il 24 ottobre 1917"],
 ["ww1","ungar","poesie scritte in trincea"],
 ["ww1","freud","le nevrosi di guerra interrogano la psicoanalisi"],
 ["ww1","disinf","propaganda, censura, bollettini"],
 ["cap","disinf","il bollettino di Cadorna accusa i soldati"],
 ["ww1","cost","la memoria delle guerre dietro l'art. 11"],
 ["ww2","cost","la Repubblica nasce dalla guerra e dalla Resistenza"],
 ["ww2","shoah","lo sterminio avviene durante la guerra"],
 ["ww2","dudu","la risposta della comunità internazionale"],
 ["ww2","einst","la fisica nucleare porta alla bomba atomica"],
 ["ww2","turing","a Bletchley Park Turing contribuisce a decifrare Enigma"],
 ["shoah","cost","l'art. 3: pari dignità senza distinzioni di razza"],
 ["rfra","illum","le idee dei filosofi diventano diritti"],
 ["illum","kant","«Che cos'è l'Illuminismo?» (1784)"],
 ["kant","dudu","l'idea di dignità della persona"],
 ["illum","smith","lo stesso secolo dei Lumi e dell'economia politica"],

 ["rinasc","leon","il genio universale del Rinascimento"],
 ["rinasc","prosp","la nuova rappresentazione dello spazio"],

 ["galileo","newton","dalla caduta dei gravi alla gravitazione universale"],

 ["dmed","clima","stagionalità e impatto ambientale del cibo"],
 ["freud","svevo","la psicoanalisi entra nel romanzo"],
 ["freud","monte","l'infanzia al centro: mente e sviluppo"],

 ["roman","beet","la musica dell'individuo e del sentimento"],

];

/* ================= COSTRUZIONE GRAFO ================= */
const discOf=id=>DISC.find(x=>x[0]===id);
const NODES=[],EDGES=[];
DISC.forEach(([id,l,f,d])=>NODES.push({id,l,f,d,kind:"disc",r:20}));
TOP.forEach(([id,l,ds,d,res])=>NODES.push({id,l,f:discOf(ds[0])[2],ds,d,res,kind:"top",r:res?11:8}));
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
TOP.forEach(([id,,ds])=>ds.forEach(dd=>EDGES.push({a:id,b:dd,t:"argomento di "+byId[dd].l,m:true})));
LINKS.forEach(([a,b,t])=>EDGES.push({a,b,t,m:false}));
const nbr={};NODES.forEach(n=>nbr[n.id]=[]);
EDGES.forEach(e=>{nbr[e.a].push([e.b,e.t,e.m]);nbr[e.b].push([e.a,e.t,e.m]);});
const col=n=>FAM[n.f].c;

/* ================= LAYOUT (mondo 1600×1100) ================= */
const WW=1600,WH=1100;
(function layout(){
  DISC.forEach((d,i)=>{const n=byId[d[0]];const a=i/DISC.length*Math.PI*2-Math.PI/2;n.x=WW/2+Math.cos(a)*470;n.y=WH/2+Math.sin(a)*380;});
  NODES.filter(n=>n.kind==="top").forEach((n,i)=>{const ds=n.ds.map(x=>byId[x]);n.x=ds.reduce((s,d)=>s+d.x,0)/ds.length*0.8+WW/2*0.2+Math.sin(i*7.1)*40;n.y=ds.reduce((s,d)=>s+d.y,0)/ds.length*0.8+WH/2*0.2+Math.cos(i*5.3)*40;});
  NODES.forEach(n=>{n.vx=0;n.vy=0;});
  for(let it=0;it<600;it++){
    const cool=1-it/600;
    for(let i=0;i<NODES.length;i++)for(let j=i+1;j<NODES.length;j++){
      const a=NODES[i],b=NODES[j];let dx=b.x-a.x,dy=b.y-a.y;const d2=dx*dx+dy*dy||1;const d=Math.sqrt(d2);
      const k=(a.kind==="disc"&&b.kind==="disc")?9000:(a.kind==="disc"||b.kind==="disc")?4200:2600;
      const f=k/d2;dx/=d;dy/=d;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}
    EDGES.forEach(e=>{const a=byId[e.a],b=byId[e.b];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;const L=e.m?110:150;const s=e.m?0.035:0.012;const f=(d-L)/d*s;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;});
    NODES.forEach(n=>{n.vx+=(WW/2-n.x)*0.0025;n.vy+=(WH/2-n.y)*0.0025;n.x+=Math.max(-14,Math.min(14,n.vx))*cool;n.y+=Math.max(-14,Math.min(14,n.vy))*cool;n.vx*=0.55;n.vy*=0.55;});
  }
})();

/* ================= RENDER ================= */
const svg=document.getElementById("net"),NS="http://www.w3.org/2000/svg";
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const defs=mk("defs");defs.innerHTML=`<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const gE=mk("g"),gN=mk("g");svg.append(defs,gE,gN);
const curve=(a,b,k)=>{const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;return `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${(mx-dy*k).toFixed(1)},${(my+dx*k).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;};
const BASE_M="rgba(150,180,240,.13)",BASE_X="rgba(170,195,245,.26)";
EDGES.forEach(e=>{
  const a=byId[e.a],b=byId[e.b];const d=curve(a,b,e.m?0.05:0.14);
  e.g=mk("g");e.base=mk("path",{d,fill:"none",stroke:e.m?BASE_M:BASE_X,"stroke-width":e.m?"1":"1.3"});e.g.append(e.base);
  if(!e.m){e.pulse=mk("path",{d,fill:"none",stroke:col(a),"stroke-width":"2","stroke-linecap":"round",pathLength:"100","stroke-dasharray":"5 95",opacity:".8"});e.g.append(e.pulse);e.off=Math.random()*100;e.sp=.18+Math.random()*.3;}
  gE.append(e.g);
});
NODES.forEach(n=>{
  const c=col(n),g=mk("g",{transform:`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`,tabindex:"0",role:"button","aria-label":`${n.l}${n.kind==="disc"?", disciplina":""}${n.res?", con risorsa":""}`});
  g.style.cursor="pointer";
  const halo=mk("circle",{r:n.r*2,fill:c,opacity:n.kind==="disc"?".13":".08"});
  const ring=mk("circle",{r:n.r,fill:"none",stroke:n.res?"#fff":c,"stroke-opacity":n.res?".9":".55","stroke-width":n.res?"2":"1.2"});
  const dot=mk("circle",{r:n.r*.55,fill:c,filter:"url(#glow)"});
  const tx=mk("text",{y:n.r+(n.kind==="disc"?17:13),"text-anchor":"middle",fill:"#E6ECF7","font-family":"Inter,system-ui,sans-serif","font-size":n.kind==="disc"?"15":"11","font-weight":n.kind==="disc"?"600":"500","paint-order":"stroke",stroke:"#070B14","stroke-width":"4","stroke-linejoin":"round"});
  tx.textContent=n.l;if(n.kind==="top"&&!n.res)tx.classList.add("tl");
  g.append(halo,ring,dot,tx);gN.append(g);n.el={g,halo,ring,tx};
  g.addEventListener("pointerdown",e=>{e.stopPropagation();n._down={x:e.clientX,y:e.clientY};});
  g.addEventListener("pointerup",e=>{if(n._down&&Math.hypot(e.clientX-n._down.x,e.clientY-n._down.y)<8)select(n.id,true);n._down=null;});
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(n.id,true);}});
});

/* ================= VISTA: zoom e spostamento ================= */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let V={x:0,y:0,w:WW,h:WH},fitW=WW;
function apply(){svg.setAttribute("viewBox",`${V.x} ${V.y} ${V.w} ${V.h}`);svg.classList.toggle("labels",V.w<fitW*0.7||innerWidth/V.w>1.05);}
function fit(){
  const xs=NODES.map(n=>n.x),ys=NODES.map(n=>n.y),pad=60;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const narrow=innerWidth<640,wide=innerWidth>=1000;
  const availW=innerWidth-(wide?420:0),topPx=narrow?175:180,botPx=narrow?Math.round(innerHeight*0.24):24,availH=Math.max(200,innerHeight-topPx-botPx);
  const s=Math.min(availW/(x1-x0),availH/(y1-y0));
  V.w=innerWidth/s;V.h=innerHeight/s;
  V.x=x0-(availW/s-(x1-x0))/2;V.y=y0-topPx/s-(availH/s-(y1-y0))/2;
  fitW=V.w;apply();
}
function zoomAt(f,cx,cy){const px=V.x+cx/innerWidth*V.w,py=V.y+cy/innerHeight*V.h;const nw=Math.max(fitW*0.15,Math.min(fitW*1.6,V.w*f));const r=nw/V.w;V.x=px-(px-V.x)*r;V.y=py-(py-V.y)*r;V.w=nw;V.h*=r;apply();}
function animateTo(tx,ty,tw){const sx=V.x,sy=V.y,sw=V.w,sh=V.h,th=tw*sh/sw;
  const nx=tx-tw*(innerWidth>=1000?0.36:0.5),ny=ty-th*(innerWidth<640?0.34:0.5);const t0=performance.now(),D=reduce?0:450;
  (function st(t){const p=D?Math.min(1,(t-t0)/D):1,e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;V.x=sx+(nx-sx)*e;V.y=sy+(ny-sy)*e;V.w=sw+(tw-sw)*e;V.h=sh+(th-sh)*e;apply();if(p<1)requestAnimationFrame(st);})(t0);}
const pts=new Map();let panStart=null,pinch=null;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){panStart={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y,moved:false};svg.classList.add("panning");}
  if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};panStart=null;}});
svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0)zoomAt(pinch.d/d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d;return;}
  if(panStart){const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;if(Math.hypot(dx,dy)>4)panStart.moved=true;V.x=panStart.vx-dx*V.w/innerWidth;V.y=panStart.vy-dy*V.h/innerHeight;apply();}});
const endP=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0){if(panStart&&!panStart.moved&&sel){sel=null;style();intro();}panStart=null;svg.classList.remove("panning");}};
svg.addEventListener("pointerup",endP);svg.addEventListener("pointercancel",endP);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*0.0015),e.clientX,e.clientY);},{passive:false});
document.getElementById("zin").onclick=()=>zoomAt(0.7,innerWidth/2,innerHeight/2);
document.getElementById("zout").onclick=()=>zoomAt(1.4,innerWidth/2,innerHeight/2);
document.getElementById("zfit").onclick=()=>fit();

/* ================= SELEZIONE ================= */
let sel=null;const hiddenF=new Set();
function style(){
  const near=sel?new Set([sel,...nbr[sel].map(x=>x[0])]):null;
  NODES.forEach(n=>{const off=hiddenF.has(n.f);const dim=off||(near&&!near.has(n.id));
    n.el.g.style.opacity=off?.06:dim?.14:1;n.el.g.style.pointerEvents=off?"none":"auto";
    n.el.tx.classList.toggle("show",!!(near&&near.has(n.id)));
    n.el.halo.setAttribute("opacity",n.id===sel?".32":(n.kind==="disc"?".13":".08"));});
  EDGES.forEach(e=>{const off=hiddenF.has(byId[e.a].f)||hiddenF.has(byId[e.b].f);const on=sel&&(e.a===sel||e.b===sel);
    e.g.style.opacity=off?.02:(sel?(on?1:.05):1);
    e.base.setAttribute("stroke",on?"rgba(235,240,250,.75)":(e.m?BASE_M:BASE_X));e.base.setAttribute("stroke-width",on?"2":(e.m?"1":"1.3"));});
}
const li=(o,t)=>{const n=byId[o];return `<button class="lk" type="button" data-id="${o}" style="color:${col(n)}"><i></i><div><b>${n.l}${n.res?" ◎":""}</b><span>${t}</span></div></button>`;};
const chip=o=>`<button class="chip" type="button" data-id="${o}" style="border-color:${col(byId[o])}">${byId[o].l}</button>`;
function wire(){document.querySelectorAll("#card [data-id]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id,true)));const c=document.getElementById("cls");if(c)c.onclick=()=>{sel=null;style();intro();};}
function select(id,move){
  const n=byId[id];sel=id;style();
  if(move)animateTo(n.x,n.y,Math.min(V.w,fitW*(n.kind==="disc"?0.62:0.5)));
  const cross=nbr[id].filter(x=>!x[2]),memb=nbr[id].filter(x=>x[2]);
  const res=(n.res||[]).map(([t,h])=>`<a class="open" href="${h}">Apri: ${t} →</a>`).join("");
  let html=`<button class="close" type="button" aria-label="Chiudi" id="cls">×</button>
   <span class="area" style="color:${col(n)}">${n.kind==="disc"?"Disciplina · "+FAM[n.f].n:n.ds.map(d=>byId[d].l).join(" · ")}</span>
   <h2>${n.l}</h2><p>${n.d}</p>`;
  if(res)html+=`<div class="btns">${res}</div>`;else if(n.kind==="top")html+=`<span class="soon">Risorsa interattiva in preparazione.</span>`;
  if(n.kind==="disc")html+=`<h3>Argomenti · ${memb.length}</h3><div class="links">${memb.map(([o])=>li(o,byId[o].res?"risorsa disponibile":(byId[o].ds.filter(d=>d!==id).map(d=>"anche "+byId[d].l).join(", ")||"argomento"))).join("")}</div>`;
  else{html+=`<h3>Discipline</h3><div class="chips">${memb.map(([o])=>chip(o)).join("")}</div>`;
    if(cross.length)html+=`<h3>Collegamenti · ${cross.length}</h3><div class="links">${cross.map(([o,t])=>li(o,t)).join("")}</div>`;}
  document.getElementById("card").innerHTML=html;wire();
  try{history.replaceState(null,"","#"+id);}catch(e){}
}
function intro(){
  const narrow=innerWidth<640;
  document.getElementById("card").innerHTML=`<span class="area" style="color:#F2B45A">Da dove partire</span><h2>Lo scibile come rete</h2>
   ${narrow?"":`<p>${DISC.length} discipline e ${TOP.length} argomenti, uniti da ${LINKS.length} legami tra saperi diversi. Gli argomenti con l'anello bianco ◎ hanno una risorsa interattiva.</p>`}
   <h3>Risorse disponibili</h3><div class="btns"><a class="open" href="grande-guerra/">Grande Guerra →</a><a class="open" href="caporetto/">Caporetto 1917 →</a></div>
   ${narrow?"":`<h3>Inizia da un nodo</h3><div class="chips">${["filo","ww1","ia","dante","chim","cibo","eia","darwin"].map(chip).join("")}</div>`}`;
  wire();
  try{history.replaceState(null,"",location.pathname);}catch(e){}
}

/* legenda e ricerca */
const lg=document.getElementById("legend");
Object.entries(FAM).forEach(([k,f])=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed","true");b.style.color=f.c;b.innerHTML=`<i></i><span style="color:var(--muted)">${f.n}</span>`;
  b.onclick=()=>{hiddenF.has(k)?hiddenF.delete(k):hiddenF.add(k);b.setAttribute("aria-pressed",String(!hiddenF.has(k)));style();};lg.append(b);});
lg.insertAdjacentHTML("beforeend",`<div class="res"><i></i>risorsa interattiva</div>`);
const dl=document.getElementById("nodelist");NODES.slice().sort((a,b)=>a.l.localeCompare(b.l,"it")).forEach(n=>{const o=document.createElement("option");o.value=n.l;dl.append(o);});
const find=v=>{v=v.trim().toLowerCase();if(!v)return null;return NODES.find(n=>n.l.toLowerCase()===v)||NODES.find(n=>n.l.toLowerCase().includes(v));};
document.getElementById("search").addEventListener("submit",e=>{e.preventDefault();const n=find(document.getElementById("q").value);if(n){select(n.id,true);document.getElementById("q").blur();}});
document.getElementById("q").addEventListener("change",e=>{if(NODES.some(x=>x.l===e.target.value))select(find(e.target.value).id,true);});

/* animazione impulsi */
function tick(t){EDGES.forEach(e=>{if(e.pulse){e.off=(e.off+e.sp)%100;e.pulse.setAttribute("stroke-dashoffset",String(-e.off));}});
  NODES.forEach((n,i)=>{if(n.kind==="disc")n.el.halo.setAttribute("r",n.r*2*(1+Math.sin(t/1000+i)*0.08));});requestAnimationFrame(tick);}

/* sfondo neurale */
const bg=document.getElementById("bg"),ctx=bg.getContext("2d");let P=[];
function bgInit(){const dpr=devicePixelRatio||1;bg.width=innerWidth*dpr;bg.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  P=Array.from({length:Math.min(170,Math.round(innerWidth*innerHeight/10000))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14}));}
function bgDraw(){ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=0;i<P.length;i++){const p=P[i];if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>innerWidth)p.vx*=-1;if(p.y<0||p.y>innerHeight)p.vy*=-1;}
    for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<90){ctx.strokeStyle=`rgba(120,150,220,${(1-d/90)*.11})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}
    ctx.fillStyle="rgba(150,180,240,.32)";ctx.beginPath();ctx.arc(p.x,p.y,1.1,0,6.3);ctx.fill();}
  if(!reduce)requestAnimationFrame(bgDraw);}

let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{fit();bgInit();if(reduce)bgDraw();},200);});
fit();bgInit();bgDraw();if(!reduce)requestAnimationFrame(tick);
const h0=location.hash.slice(1);if(h0&&byId[h0])select(h0,true);else intro();
</script>
</body>
</html>
